<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">Worth My Scroll, by FavStash</title><desc id="desc">Illustrative LinkedIn ratings: a concrete builder update is worth your time, a topic outside your focus gets amber, and an empty hype post gets red.</desc>
<rect width="1200" height="510" rx="28" fill="#111a30"/>
<g font-family="Arial, sans-serif"><rect x="42" y="40" width="46" height="46" rx="12" fill="#789cf2"/><text x="55" y="72" font-size="30" fill="white" font-weight="700">w</text><text x="103" y="61" font-size="21" fill="white" font-weight="700">worth my scroll.</text><text x="103" y="82" font-size="12" fill="#afbddb">BY FAVSTASH · POWERED BY JEV</text>
<text x="42" y="151" font-size="42" fill="white" font-weight="700">Your interests. Your signal.</text><text x="42" y="185" font-size="19" fill="#b4c2df">Personal relevance and quality scores, right in your LinkedIn feed.</text>
<g><rect x="42" y="225" width="356" height="211" rx="14" fill="#ffffff" stroke="#7ec39c" stroke-width="2"/><path d="M56 226H384Q397 226 397 240V276H43V240Q43 226 56 226" fill="#e7f5ec"/><text x="59" y="258" font-size="14" fill="#21653f" font-weight="700">● Worth your time</text><text x="335" y="258" font-size="14" fill="#21653f" font-weight="700">88/100</text><text x="60" y="310" font-size="18" fill="#18263e" font-weight="700">A builder shares what worked.</text><text x="60" y="340" font-size="15" fill="#55627a">“We shipped search. Here are our</text><text x="60" y="362" font-size="15" fill="#55627a">results, mistakes, and tradeoffs.”</text><rect x="60" y="383" width="116" height="31" rx="7" fill="#edf1fc"/><text x="73" y="404" font-size="13" fill="#3559ae">Save to Stash ↗</text><text x="195" y="404" font-size="13" fill="#586783">Why?</text></g>
<g><rect x="422" y="225" width="356" height="211" rx="14" fill="#ffffff" stroke="#e3b652" stroke-width="2"/><path d="M436 226H764Q777 226 777 240V276H423V240Q423 226 436 226" fill="#fff4d9"/><text x="439" y="258" font-size="14" fill="#936018" font-weight="700">● Outside your focus</text><text x="715" y="258" font-size="14" fill="#936018" font-weight="700">34/100</text><text x="440" y="310" font-size="18" fill="#18263e" font-weight="700">Useful. For someone else.</text><text x="440" y="340" font-size="15" fill="#55627a">A detailed update from an industry</text><text x="440" y="362" font-size="15" fill="#55627a">you are not following right now.</text><text x="440" y="404" font-size="13" fill="#586783">Your preferences make the difference.</text></g>
<g><rect x="802" y="225" width="356" height="211" rx="14" fill="#ffffff" stroke="#e99991" stroke-width="2"/><path d="M816 226H1144Q1157 226 1157 240V276H803V240Q803 226 816 226" fill="#fdebe7"/><text x="819" y="258" font-size="14" fill="#b14337" font-weight="700">● Slop alert</text><text x="1104" y="258" font-size="14" fill="#b14337" font-weight="700">8/100</text><text x="820" y="310" font-size="18" fill="#18263e" font-weight="700">Big promise. Little substance.</text><text x="820" y="340" font-size="15" fill="#55627a">“This changes EVERYTHING.</text><text x="820" y="362" font-size="15" fill="#55627a">Comment SECRET to find out.”</text><text x="820" y="404" font-size="13" fill="#586783">Filler and bait, flagged as you scroll.</text></g>
<text x="42" y="477" font-size="13" fill="#a1b1d2">ILLUSTRATIVE POSTS AND RATINGS · YOUR RESULTS DEPEND ON YOUR PREFERENCES</text></g></svg>
